name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --frozen pytest

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        site: [academy]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --frozen python manage.py distill generate --output-directory dist --collectstatic --force
        env:
          SITE: ${{ matrix.site }}
