[project]
name = "c3-sites"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "django>=6.1",
    "django-distill>=4.0.6",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.base"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not browser'"
markers = ["browser: Playwright tests against a built dist/ (just test-browser)"]
