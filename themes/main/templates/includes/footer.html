{% load documents %}{% site_document "static_footer" as footer %}<footer>
  <div class="w-screen px-2 mt-16 mb-24 lg:mb-10 lg:grid md:grid-cols-12 md:gap-x-4 md:px-4">
    <div id="footer-links" class="flex flex-col w-full pt-4 space-y-8 border-t md:flex-row md:space-y-0 md:space-x-8 border-t-black md:justify-between lg:col-start-2 lg:col-end-12">
      {% for list in footer.slices %}{% if list.type == "link_list" %}
      <div class="gap-x-8 flex">
        <h4 class="text-xl font-bold w-2/5 md:w-auto">{{ list.primary.title }}</h4>
        <div class="flex flex-col md:mt-1 w-2/5 md:w-auto">
          {% for link in list.items %}<a href="{{ link.link_url }}" class="transition-colors duration-300 hover:text-red-500">{{ link.link_title }}</a>
          {% endfor %}
        </div>
      </div>
      {% endif %}{% endfor %}
    </div>
  </div>
  <div class="w-screen px-2 my-2 lg:mb-4 lg:grid md:grid-cols-12 md:gap-x-4 md:px-4">
    <div class="lg:col-start-2 lg:col-end-12 text-sm text-black/80 border-t-black/50 border-t pt-2">
      <p>Charity number: 1132699</p>
    </div>
  </div>
</footer>
