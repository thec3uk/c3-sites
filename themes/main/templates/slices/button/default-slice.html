{% with p=slice.primary %}
{# Gatsby components/button/slice.tsx and button.tsx, default-slice colours. #}
<div class="my-6 lg:col-span-8 lg:col-start-2 md:my-4 lg:my-3">
  <div class="px-0 mx-auto my-12 max-w-7xl sm:my-16 sm:px-6 lg:px-8">
    <div class="max-w-3xl mx-auto flex{% if p.alignment == 'left' %} justify-start{% elif p.alignment == 'center' %} justify-center{% elif p.alignment == 'right' %} justify-end{% elif p.alignment == 'full' %} flex-col{% endif %}">
      <a{% if p.linkUrl %} href="{{ p.linkUrl }}"{% endif %} class="{% if p.size == 'xs' %}px-2.5 py-1.5 text-xs rounded-sm{% elif p.size == 'sm' %}px-3 py-2 text-sm leading-4 rounded-md shadow-xs{% elif p.size == 'md' %}px-4 py-2 text-sm rounded-md shadow-xs{% elif p.size == 'lg' %}px-4 py-2 text-base rounded-md shadow-xs{% elif p.size == 'xl' %}px-6 py-3 text-base rounded-md shadow-xs{% endif %} bg-gray-900 hover:bg-gray-700 hover:text-white text-gray-50 inline-flex items-center border border-transparent font-medium shadow-xs focus:outline-hidden focus:ring-2 focus:ring-offset-2{% if p.alignment == 'full' %} justify-center{% endif %}">{{ p.linkTitle|default:"" }}</a>
    </div>
  </div>
</div>
{% endwith %}
